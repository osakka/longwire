<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="longwire">
  <title>longwire</title>
  <style>
    .wire { fill: none; stroke: #C0632B; stroke-width: 4; stroke-linecap: round; }
    .node { fill: #C0632B; }
    .pulse { fill: #2FB67C; }
    .pole { stroke: #121417; stroke-width: 4; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) { .pole { stroke: #F3EEE4; } }
  </style>
  <!-- two poles, one long wire sagging between them, a signal riding it -->
  <line class="pole" x1="10" y1="18" x2="10" y2="54"/>
  <line class="pole" x1="54" y1="18" x2="54" y2="54"/>
  <path class="wire" d="M10 20 C 24 40, 40 40, 54 20"/>
  <circle class="node" cx="10" cy="20" r="5"/>
  <circle class="node" cx="54" cy="20" r="5"/>
  <circle class="pulse" cx="32" cy="35" r="3.2"/>
</svg>
